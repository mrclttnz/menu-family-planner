services:
  postgres:
    image: postgres:16-alpine
    container_name: menu-design-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menu_design}
      POSTGRES_USER: ${POSTGRES_USER:-menu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password_in_production!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Espone Postgres sulla porta 5432 per consentire l'accesso dai client nella rete locale (LAN).
      # Se vuoi limitarlo all'IP specifico del server sulla LAN, puoi impostare es: "192.168.1.50:5432:5432"
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menu_user} -d ${POSTGRES_DB:-menu_design}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menu-design-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-menu-design-production-secret-key-must-be-changed-in-prod-min-32-chars!}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-menu_user}:${POSTGRES_PASSWORD:-change_this_postgres_password_in_production!}@postgres:5432/${POSTGRES_DB:-menu_design}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: menu-design-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  postgres_data:
